[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=61.2",
]

[project]
authors = [
    { email = "christian.ledermann@gmail.com", name = "Christian Ledermann" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Library or Lesser General Public License (LGPL)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: GraalPy",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = [
    "arrow",
    "pygeoif>=1.5",
    "typing-extensions>4",
]
description = "Fast KML processing in python"
dynamic = [
    "version",
]
name = "fastkml"
requires-python = ">=3.10"

[project.license]
text = "LGPL"

[project.optional-dependencies]
complexity = [
    "complexipy",
    "lizard",
    "radon",
]
dev = [
    "fastkml[complexity,docs,linting,lxml,pyuppsala,tests,typing]",
    "pre-commit",
    "shapely",
]
docs = [
    "Sphinx",
    "pyshp",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]
linting = [
    "flake8-cognitive-complexity",
    "flake8-comments",
    "flake8-encodings",
    "flake8-expression-complexity",
    "flake8-typing-imports",
    "ruff",
    "yamllint",
]
lxml = [
    "lxml",
]
pyuppsala = [
    # 0.9.0 regressed circular xsd:import handling (spurious "Duplicate
    # attributeGroup definition" when base_path is passed), which broke
    # loading the real OGC KML schema. Fixed in 0.9.1:
    # https://github.com/kushaldas/pyuppsala/issues/25
    "pyuppsala==0.9.1",
]
tests = [
    # 6.156+ has no cp315 wheel yet; unpin once hypothesis publishes one.
    "hypothesis[dateutil]<6.156",
    "pytest",
    "pytest-cov",
    "pytz",
    "tzdata",
]
typing = [
    "lxml-stubs",
    "pyrefly",
    "ty",
]

[project.readme]
content-type = "text/x-rst"
file = "README.rst"
keywords = [
    "GIS",
    "Google",
    "KML",
    "Maps",
    "OpenLayers",
]

[project.urls]
Changelog = "https://github.com/cleder/fastkml/blob/develop/docs/HISTORY.rst"
Documentation = "https://fastkml.readthedocs.org/"
Homepage = "https://github.com/cleder/fastkml"

[tool.check-manifest]
ignore = [
    ".*",
    "examples/*",
    "mutmut_config.py",
    "tox.ini",
]

[tool.coverage.paths]
source = [
    "fastkml",
    "tests",
]

[tool.coverage.report]
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "class \\w+\\(Protocol\\)\\:",
    "except AssertionError:",
    "except ImportError:",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true

[tool.flake8]
max_line_length = 89

[tool.isort]
force_single_line = true
line_length = 88

[tool.pyrefly]
preset = "strict"
ignore-missing-imports = ["*"]
# lxml has no py.typed/inline stubs; lxml-stubs (installed for `ty`'s benefit,
# which resolves it correctly) uses legacy `# type:` comments that pyrefly
# misparses as literal `Ellipsis` values (e.g. `_Element.tag`/`.text`), so
# pyrefly treats lxml as untyped instead.
replace_imports_with_any = ["lxml.*"]

[tool.pyrefly.errors]
# Adding @override to ~80 call sites across nearly every module (__repr__,
# __init__, get_tag_name, parse, ...) is pure ceremony for this codebase's
# heavy, intentional use of inheritance; ty leaves this rule off by default.
missing-override-decorator = "ignore"

[[tool.pyrefly.sub-config]]
matches = "tests/**/*"

[tool.pyrefly.sub-config.errors]
# Tests routinely construct an object and immediately assert on a field
# typed `X | None`/`A | B | None` without a narrowing check first; mirrors
# the old mypy per-module `union-attr` override for tests.*.
missing-attribute = "ignore"

[[tool.pyrefly.sub-config]]
matches = "examples/**/*"

[tool.pyrefly.sub-config.errors]
# Example scripts demonstrate walking a heterogeneous feature tree and the
# registry's dynamic-attribute-injection extension pattern (see
# transform_cascading_style.py); neither is expressible in the class stubs.
missing-attribute = "ignore"

[tool.pyright]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".pyre",
    ".pytype",
]
include = [
    "fastkml",
]

[tool.rstcheck]
ignore_directives = [
    "autoclass",
    "automodule",
]
report_level = "WARNING"

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = [
    "ANN401",
    "D203",
    "D212",
    "FA100",
    "FBT001",
    "PLR0913",
]
select = [
    "ALL",
]

[tool.ruff.lint.extend-per-file-ignores]
"examples/*.py" = [
    "ANN001",
    "ANN201",
    "D100",
    "D104",
    "D401",
    "ICN001",
    "INP001",
    "S311",
    "T201",
]
"fastkml/helpers.py" = [
    "ARG001",
    "PLR0913",
]
"tests/*.py" = [
    "A002",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR2004",
    "S101",
    "SLF001",
]
"tests/registry_test.py" = [
    "ARG001",
]
"tests/repr_eq_test.py" = [
    "E501",
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = [
    "types",
]
builtins-ignorelist = [
    "id",
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic.version]
attr = "fastkml.about.__version__"

[tool.setuptools.package-data]
fastkml = [
    "schema/*.xsd",
]

[tool.setuptools.packages.find]
exclude = [
    "docs/*",
]
include = [
    "fastkml*",
    "fastkml/py.typed",
]
namespaces = false

[[tool.ty.overrides]]
include = [
    "examples/**",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = [
    "tests/**",
]

[tool.ty.overrides.rules]
# Same rationale as the pyrefly tests/**/* sub-config above.
invalid-assignment = "ignore"
unresolved-attribute = "ignore"

[tool.ty.rules]
# Promote checks ty leaves at "warn"/"ignore" by default, to match the
# strictness previously provided by mypy's strict flags.
missing-override-decorator = "ignore"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
